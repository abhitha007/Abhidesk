<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AbhiDesk — Screen Share + Remote Control</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>AbhiDesk 🚀</h1>
  <div class="user-pill">Your ID: <span id="userId">...</span></div>
</header>

<div class="controls">
  <input id="partnerId" type="text" placeholder="Partner ID (paste here)">
  <button id="inviteBtn">Invite</button>
  <button id="createBtn" class="ghost">New ID</button>
  <button id="disconnectBtn" class="ghost" hidden>Disconnect</button>
  <div id="connStatus" class="status">Ready to connect...</div>
</div>

<div class="main">
  <video id="remoteVideo" autoplay playsinline></video>
  <div id="debugLog" class="status">Waiting for connection...</div>
  <button id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>
</div>

<!-- Invite notification -->
<div id="inviteNotification" class="notification">
  <p><strong id="inviteUser"></strong> invited you to share your screen.</p>
  <button id="acceptInvite">Accept</button>
  <button id="declineInvite" class="ghost">Decline</button>
</div>

<!-- Control permission notification -->
<div id="controlNotification" class="notification">
  <p><strong id="controlUser"></strong> wants to control your screen.</p>
  <button id="acceptControl">Allow</button>
  <button id="declineControl" class="ghost">Decline</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="app.js"></script>
</body>
</html>
