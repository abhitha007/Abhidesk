<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AbhiDesk — Remote desktop in your browser</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="logo"><span class="mark"></span>AbhiDesk</div>
  <div class="conn" id="connBadge"><i></i><span>Ready</span></div>
</header>

<main id="home" class="home">
  <section class="card">
    <h2>Your desk</h2>
    <p class="hint">Share this ID with the person who needs to see your screen.</p>
    <div class="idbox"><strong id="myId">---</strong>
      <button class="ghost" id="copyBtn">Copy ID</button></div>
    <button class="link" id="newIdBtn">Generate a new ID</button>
  </section>
  <section class="card">
    <h2>Connect to a desk</h2>
    <p class="hint">Enter the other person's ID. They will get a request to accept.</p>
    <div class="row">
      <input id="partnerId" inputmode="numeric" maxlength="11" placeholder="000 000 000" autocomplete="off">
      <button id="connectBtn">Connect</button>
    </div>
    <p class="msg" id="homeMsg"></p>
  </section>
</main>

<section id="stage" class="stage" hidden>
  <video id="remoteVideo" autoplay playsinline muted></video>
  <div class="bar" id="bar">
    <span id="barLabel"></span>
    <button id="ctlBtn">Request control</button>
    <button class="ghost" id="fsBtn">Fullscreen</button>
    <button class="danger" id="endBtn">Disconnect</button>
  </div>
  <div class="sharing" id="sharing" hidden>
    <p>Your screen is being shared with <b id="sharingWith"></b>. <span id="ctlState">View only.</span></p>
    <button class="ghost" id="revokeBtn" hidden>Stop control</button>
    <button class="danger" id="stopBtn">Stop sharing</button>
  </div>
</section>

<div class="modal" id="modal" hidden>
  <div class="dialog">
    <h3 id="mTitle"></h3><p id="mText"></p>
    <div class="row"><button id="mYes">Accept</button><button class="ghost" id="mNo">Decline</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
